<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101a2b">
    <title>Snake Game</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #101a2b;
            --panel: #19263a;
            --panel-raised: #22324a;
            --text: #f4f7fb;
            --muted: #a9b8ca;
            --accent: #71e3a0;
            --accent-dark: #27a96a;
            --danger: #ff7272;
            --board: #0b1422;
            --grid: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(55, 113, 134, 0.2), transparent 38%),
                radial-gradient(ellipse at 90% 88%, rgba(47, 114, 88, 0.18), transparent 35%),
                var(--page);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .game {
            width: min(100%, 680px);
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 5px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            letter-spacing: -0.06em;
            line-height: 1.05;
        }

        .intro {
            margin: 10px 0 0;
            color: var(--muted);
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(34, 50, 74, 0.92), rgba(25, 38, 58, 0.96));
            box-shadow: var(--shadow);
        }

        .scorebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding: 14px 18px;
        }

        .score-item {
            min-width: 76px;
            text-align: center;
        }

        .score-label {
            display: block;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            margin-top: 2px;
            font-size: 1.45rem;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
        }

        .divider {
            width: 1px;
            height: 34px;
            background: var(--border);
        }

        .board-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--board);
            box-shadow: var(--shadow);
        }

        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            touch-action: none;
        }

        .status-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(8, 15, 26, 0.68);
            text-align: center;
        }

        .status-overlay[hidden] {
            display: none;
        }

        .status-card {
            max-width: 290px;
            padding: 20px 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(25, 38, 58, 0.96);
            box-shadow: var(--shadow);
        }

        .status-card h2 {
            margin: 0 0 6px;
            font-size: 1.5rem;
        }

        .status-card p {
            margin: 0;
            color: var(--muted);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        button,
        select {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--panel-raised);
            color: var(--text);
            font: inherit;
        }

        button {
            padding: 9px 16px;
            cursor: pointer;
            font-weight: 750;
            transition: transform 120ms ease, background-color 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #2b405d;
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .primary {
            border-color: transparent;
            background: var(--accent);
            color: #10251a;
        }

        .primary:hover {
            background: #8aefb2;
        }

        select {
            padding: 8px 32px 8px 12px;
            cursor: pointer;
        }

        .control-label {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .help {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        .mobile-controls {
            display: none;
            width: 160px;
            margin: 16px auto 0;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 48px);
            gap: 6px;
        }

        .mobile-controls button {
            min-height: 48px;
            padding: 0;
            font-size: 1.2rem;
            touch-action: manipulation;
        }

        .mobile-controls [data-direction="up"] {
            grid-column: 2;
            grid-row: 1;
        }

        .mobile-controls [data-direction="left"] {
            grid-column: 1;
            grid-row: 2;
        }

        .mobile-controls [data-direction="down"] {
            grid-column: 2;
            grid-row: 2;
        }

        .mobile-controls [data-direction="right"] {
            grid-column: 3;
            grid-row: 2;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 520px) {
            body {
                padding: 22px 12px;
            }

            .header {
                margin-bottom: 16px;
            }

            .scorebar {
                padding: 12px 10px;
            }

            .score-item {
                min-width: 64px;
            }

            .score-value {
                font-size: 1.25rem;
            }

            .mobile-controls {
                display: grid;
            }

            .help {
                max-width: 340px;
                margin: 12px auto 0;
                font-size: 0.82rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="game">
        <header class="header">
            <p class="eyebrow">A little arcade classic</p>
            <h1>Snake</h1>
            <p class="intro">Eat the fruit. Grow your snake. Don't run into yourself.</p>
        </header>

        <section class="scorebar panel" aria-label="Game score">
            <div class="score-item">
                <span class="score-label">Score</span>
                <span class="score-value" id="score">0</span>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="score-item">
                <span class="score-label">Best</span>
                <span class="score-value" id="best-score">0</span>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="score-item">
                <span class="score-label">Speed</span>
                <span class="score-value" id="speed-label">Normal</span>
            </div>
        </section>

        <section class="board-wrap" aria-label="Snake game board">
            <canvas id="board" role="img" aria-label="Snake game board. Use arrow keys or WASD to move."></canvas>
            <div class="status-overlay" id="overlay">
                <div class="status-card">
                    <h2 id="overlay-title">Ready?</h2>
                    <p id="overlay-message">Press Start, an arrow key, or WASD to play.</p>
                </div>
            </div>
        </section>

        <div class="controls">
            <button class="primary" id="start-button" type="button">Start game</button>
            <button id="restart-button" type="button">Restart</button>
            <label class="control-label" for="difficulty">Speed</label>
            <select id="difficulty">
                <option value="normal" selected>Normal</option>
                <option value="slow">Slow</option>
                <option value="fast">Fast</option>
            </select>
        </div>

        <div class="mobile-controls" aria-label="Touch direction controls">
            <button type="button" data-direction="up" aria-label="Move up">↑</button>
            <button type="button" data-direction="left" aria-label="Move left">←</button>
            <button type="button" data-direction="down" aria-label="Move down">↓</button>
            <button type="button" data-direction="right" aria-label="Move right">→</button>
        </div>

        <p class="help">Move with <strong>← ↑ → ↓</strong> or <strong>W A S D</strong> · Pause with <strong>Space</strong> or <strong>P</strong></p>
        <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script>
        (() => {
            const GRID_SIZE = 22;
            const POINTS_PER_FRUIT = 10;
            const STEP_MS = { slow: 170, normal: 125, fast: 88 };
            const DIRECTIONS = {
                ArrowUp: { x: 0, y: -1 },
                KeyW: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                KeyS: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                KeyA: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 },
                KeyD: { x: 1, y: 0 }
            };
            const canvas = document.querySelector('#board');
            const context = canvas.getContext('2d');
            const scoreElement = document.querySelector('#score');
            const bestElement = document.querySelector('#best-score');
            const speedLabel = document.querySelector('#speed-label');
            const overlay = document.querySelector('#overlay');
            const overlayTitle = document.querySelector('#overlay-title');
            const overlayMessage = document.querySelector('#overlay-message');
            const announcer = document.querySelector('#announcer');
            const startButton = document.querySelector('#start-button');
            const restartButton = document.querySelector('#restart-button');
            const difficulty = document.querySelector('#difficulty');

            let storageAvailable = true;
            let snake;
            let direction;
            let queuedDirection;
            let directionChanged;
            let food;
            let score;
            let bestScore = loadBestScore();
            let gameStatus = 'ready';
            let previousFrame = 0;
            let accumulatedTime = 0;
            let animationFrame = 0;

            function loadBestScore() {
                try {
                    return Number(localStorage.getItem('snakeGameBestScore')) || 0;
                } catch (error) {
                    storageAvailable = false;
                    return 0;
                }
            }

            function saveBestScore() {
                try {
                    localStorage.setItem('snakeGameBestScore', String(bestScore));
                } catch (error) {
                    storageAvailable = false;
                    announcer.textContent = 'Best score could not be saved in this browser.';
                }
            }

            function resetGame() {
                snake = [
                    { x: 10, y: 11 },
                    { x: 9, y: 11 },
                    { x: 8, y: 11 }
                ];
                direction = { x: 1, y: 0 };
                queuedDirection = direction;
                directionChanged = false;
                score = 0;
                food = placeFood();
                gameStatus = 'ready';
                accumulatedTime = 0;
                previousFrame = 0;
                updateScoreDisplay();
                setOverlay('Ready?', 'Press Start, an arrow key, or WASD to play.');
                startButton.textContent = 'Start game';
                draw();
            }

            function placeFood() {
                const emptyCells = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!snake.some(segment => segment.x === x && segment.y === y)) {
                            emptyCells.push({ x, y });
                        }
                    }
                }
                return emptyCells.length
                    ? emptyCells[Math.floor(Math.random() * emptyCells.length)]
                    : null;
            }

            function setOverlay(title, message) {
                overlayTitle.textContent = title;
                overlayMessage.textContent = message;
                overlay.hidden = false;
            }

            function updateScoreDisplay() {
                scoreElement.textContent = String(score);
                bestElement.textContent = String(bestScore);
            }

            function startGame() {
                if (gameStatus === 'gameover') {
                    resetGame();
                }
                gameStatus = 'running';
                overlay.hidden = true;
                startButton.textContent = 'Pause';
                previousFrame = 0;
                accumulatedTime = 0;
                cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(gameLoop);
            }

            function togglePause() {
                if (gameStatus === 'running') {
                    gameStatus = 'paused';
                    setOverlay('Paused', 'Press Space, P, or Resume to continue.');
                    startButton.textContent = 'Resume';
                    cancelAnimationFrame(animationFrame);
                } else if (gameStatus === 'paused' || gameStatus === 'ready') {
                    startGame();
                } else if (gameStatus === 'gameover' || gameStatus === 'won') {
                    resetGame();
                    startGame();
                }
            }

            function gameLoop(timestamp) {
                if (gameStatus !== 'running') return;
                if (!previousFrame) previousFrame = timestamp;
                accumulatedTime += Math.min(timestamp - previousFrame, 250);
                previousFrame = timestamp;

                const stepDuration = STEP_MS[difficulty.value];
                while (accumulatedTime >= stepDuration && gameStatus === 'running') {
                    updateGame();
                    accumulatedTime -= stepDuration;
                }

                draw();
                if (gameStatus === 'running') {
                    animationFrame = requestAnimationFrame(gameLoop);
                }
            }

            function updateGame() {
                direction = queuedDirection;
                directionChanged = false;
                const head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };
                const ateFood = food && head.x === food.x && head.y === food.y;
                const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
                const hitWall = head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
                const hitSelf = bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y);

                if (hitWall || hitSelf) {
                    endGame();
                    return;
                }

                snake.unshift(head);
                if (ateFood) {
                    score += POINTS_PER_FRUIT;
                    if (score > bestScore) {
                        bestScore = score;
                        saveBestScore();
                    }
                    food = placeFood();
                    updateScoreDisplay();
                    announcer.textContent = `Score ${score}. Fruit eaten.`;
                    if (!food) {
                        gameStatus = 'won';
                        setOverlay('You win!', `You filled the board with a score of ${score}.`);
                        startButton.textContent = 'Play again';
                        announcer.textContent = 'You win! The board is full.';
                    }
                } else {
                    snake.pop();
                }
            }

            function endGame() {
                gameStatus = 'gameover';
                setOverlay('Game over', `Final score: ${score}. Press Restart to play again.`);
                startButton.textContent = 'Play again';
                announcer.textContent = `Game over. Your score is ${score}.`;
            }

            function changeDirection(nextDirection) {
                if (gameStatus === 'gameover' || gameStatus === 'won') return;
                if (directionChanged) return;
                if (nextDirection.x === -direction.x && nextDirection.y === -direction.y) return;
                if (nextDirection.x === -queuedDirection.x && nextDirection.y === -queuedDirection.y) return;
                queuedDirection = nextDirection;
                directionChanged = true;
                if (gameStatus === 'ready') startGame();
            }

            function draw() {
                const cssSize = canvas.clientWidth;
                if (!cssSize) return;
                const pixelRatio = window.devicePixelRatio || 1;
                const pixelSize = Math.round(cssSize * pixelRatio);
                if (canvas.width !== pixelSize || canvas.height !== pixelSize) {
                    canvas.width = pixelSize;
                    canvas.height = pixelSize;
                }
                context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

                const cellSize = cssSize / GRID_SIZE;
                context.fillStyle = '#0b1422';
                context.fillRect(0, 0, cssSize, cssSize);

                context.strokeStyle = 'rgba(255, 255, 255, 0.055)';
                context.lineWidth = 1;
                for (let i = 1; i < GRID_SIZE; i++) {
                    const position = i * cellSize;
                    context.beginPath();
                    context.moveTo(position, 0);
                    context.lineTo(position, cssSize);
                    context.moveTo(0, position);
                    context.lineTo(cssSize, position);
                    context.stroke();
                }

                if (food) {
                    const foodCenterX = (food.x + 0.5) * cellSize;
                    const foodCenterY = (food.y + 0.5) * cellSize;
                    context.fillStyle = '#ff7272';
                    context.beginPath();
                    context.arc(foodCenterX, foodCenterY, cellSize * 0.34, 0, Math.PI * 2);
                    context.fill();
                    context.fillStyle = '#ffd1a8';
                    context.beginPath();
                    context.arc(foodCenterX - cellSize * 0.1, foodCenterY - cellSize * 0.1, cellSize * 0.08, 0, Math.PI * 2);
                    context.fill();
                }

                snake.forEach((segment, index) => {
                    const inset = cellSize * 0.1;
                    const radius = cellSize * 0.27;
                    const x = segment.x * cellSize + inset;
                    const y = segment.y * cellSize + inset;
                    const size = cellSize - inset * 2;
                    context.fillStyle = index === 0 ? '#a0f5bd' : '#48cc82';
                    context.beginPath();
                    context.roundRect(x, y, size, size, radius);
                    context.fill();

                    if (index === 0) {
                        const eyeRadius = cellSize * 0.055;
                        const forwardX = direction.x * cellSize * 0.15;
                        const forwardY = direction.y * cellSize * 0.15;
                        const sideX = direction.y * cellSize * 0.15;
                        const sideY = -direction.x * cellSize * 0.15;
                        context.fillStyle = '#173526';
                        for (const side of [-1, 1]) {
                            context.beginPath();
                            context.arc(
                                x + size / 2 + forwardX + sideX * side,
                                y + size / 2 + forwardY + sideY * side,
                                eyeRadius,
                                0,
                                Math.PI * 2
                            );
                            context.fill();
                        }
                    }
                });
            }

            document.addEventListener('keydown', event => {
                if (DIRECTIONS[event.code]) {
                    event.preventDefault();
                    changeDirection(DIRECTIONS[event.code]);
                } else if (event.code === 'Space' || event.code === 'KeyP') {
                    event.preventDefault();
                    togglePause();
                }
            });

            startButton.addEventListener('click', togglePause);
            restartButton.addEventListener('click', resetGame);
            difficulty.addEventListener('change', () => {
                speedLabel.textContent = difficulty.options[difficulty.selectedIndex].text;
            });

            document.querySelectorAll('[data-direction]').forEach(button => {
                button.addEventListener('click', () => {
                    const directions = {
                        up: { x: 0, y: -1 },
                        down: { x: 0, y: 1 },
                        left: { x: -1, y: 0 },
                        right: { x: 1, y: 0 }
                    };
                    changeDirection(directions[button.dataset.direction]);
                });
            });

            let touchStartX = 0;
            let touchStartY = 0;
            canvas.addEventListener('pointerdown', event => {
                touchStartX = event.clientX;
                touchStartY = event.clientY;
            });
            canvas.addEventListener('pointerup', event => {
                const deltaX = event.clientX - touchStartX;
                const deltaY = event.clientY - touchStartY;
                if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    changeDirection({ x: Math.sign(deltaX), y: 0 });
                } else {
                    changeDirection({ x: 0, y: Math.sign(deltaY) });
                }
            });

            window.addEventListener('resize', draw);
            bestElement.textContent = String(bestScore);
            if (!storageAvailable) {
                announcer.textContent = 'Best score storage is unavailable; scores will not persist after closing this page.';
            }
            resetGame();
        })();
    </script>
</body>
</html>
